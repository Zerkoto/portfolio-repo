    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.portfolioTheme = {
            isDark: function () {
                return document.documentElement.dataset.theme !== "light";
            },
            toggle: function () {
                const nextTheme = this.isDark() ? "light" : "dark";
                document.documentElement.dataset.theme = nextTheme;
                try {
                    localStorage.setItem("portfolio-theme", nextTheme);
                } catch {
                    // Keep the selected theme even when persistence is unavailable.
                }
                document.querySelector('meta[name="theme-color"]')
                    .setAttribute("content", nextTheme === "dark" ? "#0c0d0f" : "#f4f5f2");
                return nextTheme === "dark";
            }
        };

        window.portfolioNavigation = {
            focusMainContent: function () {
                const main = document.getElementById("main-content");
                main?.focus({ preventScroll: true });
                main?.scrollIntoView({ block: "start" });
            },
            focusMenuButton: function () {
                document.querySelector(".menu-toggle")?.focus();
            },
            scrollToCurrentHash: function () {
                if (this.stopRestoration) {
                    this.stopRestoration();
                }
                const requestedHash = window.location.hash;
                let targetId;
                try {
                    targetId = decodeURIComponent(requestedHash.replace(/^#/, ""));
                } catch {
                    return;
                }
                const app = document.getElementById("app");
                if (!targetId || !app) {
                    return;
                }

                let frame;
                let timer;
                let lastTargetPosition;
                let stopped = false;
                const cancelEvents = ["pointerdown", "wheel", "touchstart", "keydown"];
                const observer = new MutationObserver(function () {
                    window.cancelAnimationFrame(frame);
                    frame = window.requestAnimationFrame(alignTarget);
                });

                const stopRestoration = function () {
                    stopped = true;
                    observer.disconnect();
                    window.cancelAnimationFrame(frame);
                    window.clearTimeout(timer);
                    cancelEvents.forEach(function (name) {
                        document.removeEventListener(name, stopRestoration, true);
                    });
                    window.removeEventListener("hashchange", stopRestoration);
                };

                const alignTarget = function () {
                    if (stopped) {
                        return;
                    }
                    if (window.location.hash !== requestedHash) {
                        stopRestoration();
                        return;
                    }

                    const target = document.getElementById(targetId);
                    if (target) {
                        const targetPosition = target.getBoundingClientRect().top + window.scrollY;
                        if (targetPosition !== lastTargetPosition) {
                            target.scrollIntoView({ block: "start", behavior: "instant" });
                            lastTargetPosition = targetPosition;
                        }
                    }

                    // Sections load independently. Keep the anchor aligned until
                    // all content has rendered, including on slower connections.
                    const contentReady = [".hero-grid", ".focus-grid", ".skills-grid", ".experience-grid", ".contact-links"]
                        .every(function (selector) { return app.querySelector(selector); });
                    if (contentReady) {
                        stopRestoration();
                    }
                };

                this.stopRestoration = stopRestoration;
                cancelEvents.forEach(function (name) {
                    document.addEventListener(name, stopRestoration, { capture: true, passive: true });
                });
                window.addEventListener("hashchange", stopRestoration);
                observer.observe(app, {
                    childList: true,
                    subtree: true
                });
                timer = window.setTimeout(stopRestoration, 30000);
                frame = window.requestAnimationFrame(alignTarget);
            }
        };

        document.addEventListener("click", function (event) {
            if (event.target.classList.contains("dismiss")) {
                document.getElementById("blazor-error-ui").style.display = "none";
            }
        });
    </script>
